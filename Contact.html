<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f4f4f4;
      font-family: Arial, sans-serif;
    }
    .contact-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      padding: 40px;
      max-width: 600px;
      margin: 50px auto;
    }
    h2 {
      color: #006d6d;
      font-weight: 700;
    }
    .form-control {
      background-color: #f6f6f6;
      border: 1px solid #ddd;
    }
    .btn-custom {
      background-color: #006d6d;
      color: white;
      font-weight: 600;
    }
    .btn-custom:hover {
      background-color: #005a5a;
    }
    .social-icons a {
      margin: 0 8px;
      color: #333;
      background-color: #f1f1f1;
      padding: 10px 12px;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
      font-size: 18px;
      transition: 0.3s;
    }
    .social-icons a:hover {
      background-color: #006d6d;
      color: white;
    }

     /* Sidebar styles */
    .sidebar {
      height: 100%;
      width: 0;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #333;
      overflow-x: hidden;
      transition: 0.3s;
      padding-top: 60px;
    }

    .sidebar a {
      padding: 10px 20px;
      text-decoration: none;
      font-size: 18px;
      color: white;
      display: block;
      transition: 0.2s;
    }

    .sidebar a:hover {
      background-color: #575757;
    }

    /* Hamburger button */
    .hamburger {
      font-size: 24px;
      cursor: pointer;
      background: #333;
      color: white;
      padding: 10px 15px;
      border: none;
      position: fixed;
      top: 10px;
      left: 10px;
      height: 1.5cm;
      width: 1.5cm;
    }

  </style>
  <!-- FontAwesome for icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <!-- Hamburger button -->
  <button class="hamburger" onclick="toggleSidebar()">☰</button>

  <!-- Sidebar menu -->
  <div id="mySidebar" class="sidebar">
    <a href="pages.html">Home</a>
    <a href="About.html">About</a>
    <a href="Project.html">Project</a>
    <a href="Components.html">Components</a>
    <a href="Contact.html">Contacts</a>
  </div>


  <script>
    function toggleSidebar() {
      let sidebar = document.getElementById("mySidebar");
      if (sidebar.style.width === "200px") {
        sidebar.style.width = "0";
      } else {
        sidebar.style.width = "200px";
      }
    }
  </script>

  <div class="contact-card text-center">
    <h2>Contact Us</h2>
    <p class="text-muted">Have questions? We would love to hear from you.</p>

    <form>
      <div class="mb-3 text-start">
        <label for="name" class="form-label fw-bold">Name</label>
        <input type="text" class="form-control" id="name" placeholder="Your Name">
      </div>

      <div class="mb-3 text-start">
        <label for="email" class="form-label fw-bold">Email</label>
        <input type="email" class="form-control" id="email" placeholder="your.email@example.com">
      </div>

      <div class="mb-3 text-start">
        <label for="message" class="form-label fw-bold">Message</label>
        <textarea class="form-control" id="message" rows="5" placeholder="Your message..."></textarea>
      </div>

      <button type="submit" class="btn btn-custom w-100">Send Message</button>
    </form>

    <p class="mt-4 mb-2 text-muted">Or connect with us on social media:</p>

    <div class="social-icons">
      <a href="#"><i class="bi bi-github"></i></a>
      <a href="#"><i class="bi bi-linkedin"></i></a>
      <a href="#"><i class="bi bi-instagram"></i></a>
      <a href="#"><i class="bi bi-twitter-x"></i></a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</body>
</html>
